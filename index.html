<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Link</title>
<style>
*{box-sizing:border-box}
:root{
  --bg1:#68679e;--bg2:#aaa8c8;--bar:#5d5c92;
  --white:#fff;--shadow:rgba(44,42,83,.28)
}
body{
  margin:0; min-height:100vh; color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.08),transparent 30%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}
.topbar{
  height:76px;display:flex;align-items:center;
  background:rgba(66,65,119,.42);
  border-bottom:1px solid rgba(255,255,255,.14);
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.menu{
  width:76px;height:76px;border:0;color:#fff;background:rgba(47,46,91,.30);
  font-size:32px;cursor:pointer
}
.brand{font-size:23px;font-weight:800;padding-left:22px;letter-spacing:.5px}
.main{width:min(960px,92%);margin:34px auto 55px}
.title{text-align:center;margin-bottom:32px}
.title h1{font-size:clamp(28px,5vw,40px);margin:0 0 6px}
.title p{margin:0;opacity:.78;font-size:14px}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:38px 55px;max-width:780px;margin:auto
}
.card{
  color:#fff;text-decoration:none;text-align:center;display:block;
  -webkit-tap-highlight-color:transparent
}
.icon{
  width:150px;height:150px;margin:auto;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:58px;
  background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.13));
  border:2px solid rgba(255,255,255,.25);
  box-shadow:0 9px 0 var(--shadow),0 16px 25px rgba(35,34,73,.18);
  transition:.15s transform,.15s box-shadow;
}
.card:active .icon{transform:translateY(5px);box-shadow:0 4px 0 var(--shadow),0 8px 14px rgba(35,34,73,.16)}
.label{
  display:block;margin-top:14px;font-size:18px;font-weight:700;
  text-shadow:0 2px 3px rgba(0,0,0,.2)
}
.drawer{
  position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(315px,82vw);
  background:#454474;transform:translateX(-105%);transition:.22s ease;
  box-shadow:12px 0 30px rgba(0,0,0,.25);padding-top:76px
}
.drawer.open{transform:translateX(0)}
.drawer h2{font-size:20px;margin:24px}
.drawer a{
  display:block;padding:18px 24px;color:#fff;text-decoration:none;
  font-weight:700;font-size:18px;border-top:1px solid rgba(255,255,255,.09)
}
.drawer a:active{background:rgba(255,255,255,.1)}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.3);
  z-index:40;display:none
}
.overlay.show{display:block}
@media(max-width:700px){
  .topbar,.menu{height:64px}.menu{width:64px;font-size:28px}
  .brand{font-size:19px;padding-left:15px}
  .main{margin-top:25px}
  .grid{grid-template-columns:repeat(2,1fr);gap:31px 14px}
  .icon{width:125px;height:125px;font-size:49px}
  .label{font-size:16px}
}
@media(max-width:390px){
  .icon{width:112px;height:112px;font-size:44px}
  .label{font-size:15px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <div class="brand">Daily Link</div>
</header>

<aside class="drawer" id="drawer">
  <h2>MENU</h2>
  <a href="#" onclick="kpi(event)">📊 &nbsp;Report KPI</a>
</aside>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<main class="main">
  <section class="title">
    <h1>Warehouse Support</h1>
    <p>Links</p>
  </section>

  <section class="grid">

    <a class="card" href="https://insigma.valeindonesia.co.id/web#action=292&model=stock.quant&view_type=list&cids=1&menu_id=174" target="_blank">
      <div class="icon">⭕</div><span class="label">Odoo</span>
    </a>
    
    <a class="card" href="https://nuraffandyy.github.io/Goods-Holding-MaterialNumber/" target="_blank">
      <div class="icon">📑</div><span class="label">MN Full Description</span>
    </a>

    <a class="card" href="https://ptviforms.valeindonesia.com/public?id=ICOdQcOHy7AMCV8q1o4cgA%3D%3D&lang=en-US" target="_blank">
      <div class="icon">🚗</div><span class="label">Precheck LV</span>
    </a>

    <a class="card" href="https://ptviforms.valeindonesia.com/public?id=EyE5%2BAf7b22mts8jJJ1Fmg%3D%3D&lang=en-US" target="_blank">
      <div class="icon">🏋️‍♀️</div><span class="label">Fit to Work</span>
    </a>

    <a class="card" href="https://forms.gle/AYQYXJvKun1XHzpa8" target="_blank">
      <div class="icon">🚨</div><span class="label">Precheck Unit</span>
    </a>
    
  </section>
</main>

<script>
function toggleMenu(){
  drawer.classList.toggle('open');overlay.classList.toggle('show')
}
function closeMenu(){
  drawer.classList.remove('open');overlay.classList.remove('show')
}
function kpi(e){
  e.preventDefault();
  alert('Report KPI — link akan ditambahkan.');
}
</script>
</body>
</html>
