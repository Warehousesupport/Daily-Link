<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Link</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#fff;
  --text:#111;
  --muted:#666;
  --line:#e7e7e7;
  --shadow:rgba(0,0,0,.08);
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.topbar{
  height:76px;display:flex;align-items:center;background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 5px rgba(0,0,0,.04);
}
.menu{
  width:76px;height:76px;border:0;border-right:1px solid #f0f0f0;
  color:#111;background:#fff;font-size:32px;cursor:pointer
}
.brand{font-size:23px;font-weight:800;padding-left:22px;letter-spacing:.5px;color:#111}
.main{width:min(960px,92%);margin:50px auto 55px}
.title{text-align:center;margin-bottom:48px}
.title h1{font-size:clamp(28px,5vw,40px);margin:0 0 8px;color:#111;font-weight:800}
.title p{margin:0;color:#666;font-size:16px}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:38px 55px;max-width:780px;margin:auto
}
.card{
  color:#111;text-decoration:none;text-align:center;display:block;
  -webkit-tap-highlight-color:transparent
}
.icon{
  width:150px;height:150px;margin:auto;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:58px;background:#fff;color:#111;
  border:1px solid #e5e5e5;
  box-shadow:0 4px 16px var(--shadow);
  filter:grayscale(1);
  transition:.15s transform,.15s box-shadow
}
.card:hover .icon{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.11)}
.card:active .icon{transform:translateY(1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.label{display:block;margin-top:14px;font-size:18px;font-weight:700;color:#111}
.drawer{
  position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(315px,82vw);
  background:#fff;transform:translateX(-105%);transition:.22s ease;
  box-shadow:10px 0 25px rgba(0,0,0,.12);padding-top:76px;border-right:1px solid #e8e8e8
}
.drawer.open{transform:translateX(0)}
.drawer h2{font-size:20px;color:#111;margin:24px}
.drawer a{
  display:block;padding:18px 24px;color:#111;text-decoration:none;
  font-weight:700;font-size:18px;border-top:1px solid #eee
}
.drawer a:active{background:#f5f5f5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40;display:none}
.overlay.show{display:block}

@media(max-width:700px){
  .topbar,.menu{height:64px}
  .menu{width:64px;font-size:28px}
  .brand{font-size:19px;padding-left:15px}
  .main{margin-top:34px}
  .title{margin-bottom:35px}
  .title h1{font-size:30px}
  .grid{grid-template-columns:repeat(2,1fr);gap:31px 14px}
  .icon{width:125px;height:125px;font-size:49px}
  .label{font-size:16px}
}
@media(max-width:390px){
  .icon{width:112px;height:112px;font-size:44px}
  .label{font-size:15px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <div class="brand">Daily Link</div>
</header>

<aside class="drawer" id="drawer">
  <h2>MENU</h2>
  <a href="#" onclick="kpi(event)">📊 &nbsp;Report KPI</a>
</aside>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<main class="main">
  <section class="title">
    <h1>Warehouse Support</h1>
    <p>Links</p>
  </section>

  <section class="grid">

    <a class="card" href="https://insigma.valeindonesia.co.id/web#action=292&model=stock.quant&view_type=list&cids=1&menu_id=174" target="_blank">
      <div class="icon">⭕</div><span class="label">Odoo</span>
    </a>

    <a class="card" href="https://warehousesupport.github.io/Goods-Holding-MaterialNumber/" target="_blank">
      <div class="icon">📑</div><span class="label">MN Full Description</span>
    </a>

    <a class="card" href="https://ptviforms.valeindonesia.com/public?id=ICOdQcOHy7AMCV8q1o4cgA%3D%3D&lang=en-US" target="_blank">
      <div class="icon">🚗</div><span class="label">Precheck LV</span>
    </a>

    <a class="card" href="https://ptviforms.valeindonesia.com/public?id=EyE5%2BAf7b22mts8jJJ1Fmg%3D%3D&lang=en-US" target="_blank">
      <div class="icon">🏋️‍♀️</div><span class="label">Fit to Work</span>
    </a>

    <a class="card" href="https://forms.gle/AYQYXJvKun1XHzpa8" target="_blank">
      <div class="icon">🚨</div><span class="label">Precheck Unit</span>
    </a>

  </section>
</main>

<script>
function toggleMenu(){
  drawer.classList.toggle('open');
  overlay.classList.toggle('show');
}
function closeMenu(){
  drawer.classList.remove('open');
  overlay.classList.remove('show');
}
function kpi(e){
  e.preventDefault();
  alert('Report KPI — link akan ditambahkan.');
}
</script>
</body>
</html>
